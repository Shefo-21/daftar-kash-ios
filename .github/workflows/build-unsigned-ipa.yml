# Build unsigned iOS IPA — no Mac, no paid Apple Developer account.
# Runs on GitHub's free macOS runner. The IPA it produces is UNSIGNED:
# install it with Sideloadly / AltStore, which re-sign it on your computer
# with your own free Apple ID (7-day signature, refresh weekly).
# Signing happens at install time, on your computer — never share your
# Apple ID password in chat or with anyone.
name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build unsigned device IPA
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        working-directory: ios/App
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/App.app
          zip -qry dftr-kash-unsigned.ipa Payload
          ls -lh dftr-kash-unsigned.ipa
          unzip -l dftr-kash-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: dftr-kash-unsigned-ipa
          path: ios/App/dftr-kash-unsigned.ipa
          if-no-files-found: error
